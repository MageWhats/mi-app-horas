# Revisa cada semana las dependencias y abre pull requests con actualizaciones y parches de seguridad
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Las actualizaciones menores se agrupan en un solo pull request
      menores:
        update-types: [minor, patch]
    ignore:
      # Expo fija estas versiones por SDK: se actualizan juntas con `npx expo install --fix` al cambiar de SDK
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-native*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
